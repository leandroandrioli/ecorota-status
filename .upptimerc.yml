# Nome da sua Status Page e do seu projeto
owner: seu-usuario-github
repo: ecorota-status

# Configurações do site de status
sites:
  - name: API Backend Ecorota
    url: https://sua-api.onrender.com/api/v1/health # Substitua pela sua URL
    icon: https://raw.githubusercontent.com/twitter/twemoji/master/assets/svg/1f33f.svg # Ícone opcional

  - name: Aplicação Web (Frontend)
    url: https://ecorota.vercel.app # Substitua pela URL do seu Frontend

# Configurações de notificação e estilo
status-website:
  cname: status.seu-dominio.com # (Opcional) remova esta linha se não usar domínio próprio
  logoUrl: https://raw.githubusercontent.com/twitter/twemoji/master/assets/svg/1f30d.svg
  name: Status Ecorota
  introTitle: "Página de Monitoramento do Projeto Ecorota"
  introMessage: "Status em tempo real do ecossistema e serviços da solução Ecorota."

# Frequência de teste (padrão de 5 em 5 minutos)
workflowDispatch: true
